# Agent Office - herdr plugin manifest (design.md section 9).
# Pure Python stdlib, so no [[build]] step is needed - `herdr plugin install`
# just checks out the repo and runs the panes/actions below with CWD = plugin
# root.
#
# Why every entry is declared twice. herdr spawns `command` as argv with no
# shell, resolving argv[0] against PATH (plus PATHEXT on Windows), and no
# interpreter name resolves on all three platforms: `python3` is what unix
# has, but the python.org installer does not create a `python3.exe`, so on a
# plain Windows box the unix command would fail to spawn and the pane would
# simply never appear. Item-level `platforms` overrides the top-level list,
# and ids have to be unique inside a plugin, hence the `-windows` twins.

# The id carries the `herdr-` prefix because that is what the marketplace is
# named by: of the published plugins carrying the `herdr-plugin` topic, most
# spell themselves `herdr-<thing>`, and the repository was renamed to match.
# The id is not cosmetic - herdr qualifies globally unique names as
# `<id>.<action>` and roots the plugin's config directory at `<id>/`, so this
# line is what `herdr-agent-office.open` and the config path in the README
# both derive from.
id = "herdr-agent-office"
name = "Agent Office"
version = "0.1.0"
description = "Your agent fleet as a pixel-art office: see who's working, who's stuck, jump to them."
# 0.7.5, not 0.7.4: the [[startup]] hook below is a 0.7.5 feature, and a plugin
# that declares a floor it does not actually work on is worse than one that
# asks for an upgrade - on 0.7.4 the restart recovery would be silently absent
# (or the manifest rejected outright; which of the two is unmeasured).
min_herdr_version = "0.7.5"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "office"
title = "Agent Office"
placement = "tab"                 # horizontal layout suits a tab/zoomed pane
platforms = ["linux", "macos"]
command = ["python3", "-m", "office", "run"]

[[panes]]
id = "office-windows"
title = "Agent Office"
placement = "tab"
platforms = ["windows"]
command = ["py", "-3", "-m", "office", "run"]

[[actions]]
id = "open"
title = "Open Agent Office"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["python3", "-m", "office", "action-open"]

[[actions]]
id = "open-windows"
title = "Open Agent Office"
contexts = ["global"]
platforms = ["windows"]
command = ["py", "-3", "-m", "office", "action-open"]

[[actions]]
id = "jump-blocked"
title = "Jump to longest-blocked agent"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["python3", "-m", "office", "action-jump-blocked"]

[[actions]]
id = "jump-blocked-windows"
title = "Jump to longest-blocked agent"
contexts = ["global"]
platforms = ["windows"]
command = ["py", "-3", "-m", "office", "action-jump-blocked"]

# Restart recovery (issue #39). A server restart brings the office pane's
# *frame* back - label, cwd, tab position - but does not re-run the command
# above, so without this hook the plugin comes back as a bare shell wearing the
# "Agent Office" label: no toasts, no state.json, nothing saying it died.
# herdr runs one startup hook per enabled plugin after the session is restored,
# so `office startup` is where the pane gets its process back. It is a no-op
# unless a restored frame is there to reclaim - see office/actions.py.
[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "-m", "office", "startup"]

[[startup]]
platforms = ["windows"]
command = ["py", "-3", "-m", "office", "startup"]
